name: Atualizar site

on:
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:
    inputs:
      max_details:
        description: "Quantas corridas detalhar nesta execução"
        default: "90"
  push:
    branches: [main]
    paths: ["site-strava/posts/**", "site-strava/site.config.json"]

permissions:
  contents: write

concurrency:
  group: atualizar-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-strava
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar dados do Strava
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          MAX_DETAILS: ${{ github.event.inputs.max_details || '90' }}
        run: python scripts/fetch_strava.py

      - name: Atualizar índice do blog
        run: python scripts/build_posts.py

      - name: Salvar no repositório
        run: |
          git config user.name "strava-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data posts
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Atualiza dados do Strava"
            git push
          fi
